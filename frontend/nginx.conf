server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing fallback (no routes yet, but this is the standard SPA shape and
    # costs nothing to have ready for when Phase 7's UI adds real pages).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
