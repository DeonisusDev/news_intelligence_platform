[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    # FastAPI's own recommended pattern is Depends(...) in argument defaults - flagging it
    # as a general "don't call functions in defaults" antipattern doesn't apply here.
    "B008",
]

[tool.pytest.ini_options]
# Mirrors how each half of the codebase is actually deployed: news_pipeline/ is imported as a
# package from Airflow's dags folder, fastapi_app's own files are copied flat into /app with no
# wrapping package (see fastapi_app/Dockerfile) - adding both directories here (rather than
# fastapi_app.main) matches that layout instead of fighting it.
pythonpath = ["airflow/dags", "fastapi_app"]
testpaths = ["tests"]
