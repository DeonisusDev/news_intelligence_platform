x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    # Must match across all Airflow containers - see .env.example for why.
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    # SimpleAuthManager (Airflow 3 default) - all_admins skips per-user password friction.
    # Dev/local-only setting; not appropriate if this were ever exposed beyond localhost.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    # Airflow 3's task supervisor process calls back to the API server over HTTP for task
    # execution (not directly to the DB). LocalExecutor reads this specifically from
    # [core] execution_api_server_url (see airflow/executors/local_executor.py) - it
    # otherwise defaults to localhost:8080, which is wrong across containers.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # App-level Connections/Variables consumed by our DAG code (see airflow/plugins/news_pipeline).
    AIRFLOW_CONN_NEWSDATA_PG: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${NEWSDATA_DB}
    AIRFLOW_CONN_MINIO_S3: aws://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@?endpoint_url=http%3A%2F%2Fminio%3A9000
    AIRFLOW_VAR_NEWSAPI_API_KEY: ${NEWSAPI_API_KEY}
    AIRFLOW_VAR_NEWSAPI_CATEGORIES: ${NEWSAPI_CATEGORIES}
    AIRFLOW_VAR_NEWSAPI_MAX_REQUESTS_PER_RUN: ${NEWSAPI_MAX_REQUESTS_PER_RUN}
    AIRFLOW_VAR_GNEWS_API_KEY: ${GNEWS_API_KEY}
    AIRFLOW_VAR_GNEWS_CATEGORIES: ${GNEWS_CATEGORIES}
    AIRFLOW_VAR_GNEWS_MAX_REQUESTS_PER_RUN: ${GNEWS_MAX_REQUESTS_PER_RUN}
    AIRFLOW_VAR_OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    AIRFLOW_VAR_OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
    AIRFLOW_VAR_OPENROUTER_MODEL: ${OPENROUTER_MODEL}
    AIRFLOW_VAR_MINIO_BUCKET: ${MINIO_BUCKET}
    AIRFLOW_VAR_CLICKHOUSE_HOST: clickhouse
    AIRFLOW_VAR_CLICKHOUSE_PORT: "8123"
    AIRFLOW_VAR_CLICKHOUSE_USER: ${CLICKHOUSE_USER}
    AIRFLOW_VAR_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    AIRFLOW_VAR_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs
    - ./dbt:/opt/airflow/dbt
    - ./prompts:/opt/airflow/prompts
  user: "${AIRFLOW_UID}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET}
      "
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    # ClickHouse-in-Docker needs a raised nofile ulimit or it fails cryptically
    # under load ("too many open files").
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/clickhouse:/docker-entrypoint-initdb.d
    ports:
      - "8123:8123"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: ["-c", "airflow db migrate"]

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  fastapi:
    build:
      context: .
      dockerfile: fastapi_app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB}
      NEWSDATA_PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${NEWSDATA_DB}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-side, so this must be reachable from the *host*, not the Docker network
        # (fastapi:8000 would resolve inside other containers but not in the user's browser).
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  clickhouse_data:
  airflow_logs:
