version: 2

models:
  - name: mart_articles
    description: API-facing article projection, denormalized with dim_source. Full rebuild each run.
    columns:
      - name: url_hash
        description: SHA-256 of the article URL - the stable dedup/join key reused at every layer of this pipeline.
        tests: [unique, not_null]
      - name: title
        description: Article headline, trimmed of leading/trailing whitespace.
      - name: description
        description: Short summary/dek as reported by the source, trimmed of leading/trailing whitespace.
      - name: content
        description: >
          Article body as reported by the provider, unmodified. NewsAPI's free tier truncates
          this to ~260 characters (see is_content_truncated); GNews has no such limit.
      - name: is_content_truncated
        description: >
          True when content's length is at or above the free-tier truncation threshold (260
          chars) - a heuristic flag inferred from length, not an exact truncation marker the
          provider reports.
      - name: url
        description: Canonical article URL - the identity the provider itself considers unique per article.
        tests: [not_null]
      - name: url_domain
        description: Domain extracted from url - groups articles by publishing domain independent of the self-reported source_name.
      - name: url_to_image
        description: Thumbnail image URL as reported by the source, if any.
      - name: published_at
        description: Source-reported publish timestamp.
      - name: category
        description: Top-headlines category this article was fetched under (e.g. "technology", "sports") - see docs/adr/0006.
      - name: source_provider
        description: Which ingestion API returned this row - "newsapi" or "gnews".
      - name: source_id
        description: >
          dim_source's resolved source_id for this article's source_name - not the article's own
          (often-null) source_id from earlier layers. Best-effort, not guaranteed non-null.
      - name: source_name
        description: Human-readable outlet name as reported by the provider - the reliably-populated identifier used for joins.
      - name: fetched_at
        description: When the ingestion DAG fetched this row.

  - name: dim_source
    description: >
      One row per source_name (the reliably-populated NewsAPI field) with a best-effort
      source_id and a sample article domain.
    columns:
      - name: source_name
        description: >
          Human-readable outlet name as reported by the provider - grouping key for this table.
          Null source_name is coalesced to the literal "Unknown" so every article still resolves
          to a source row.
        tests: [unique, not_null]
      - name: source_id
        description: >
          An arbitrary (any()) provider-assigned source_id seen for this source_name - only
          meaningful for the small set of "top sources" NewsAPI actually populates an id for;
          null for the rest.
      - name: sample_domain
        description: An arbitrary (any()) url_domain seen for this source_name - a representative domain, not a verified canonical one.

  - name: mart_daily_stats
    description: Article counts by published date and source. Recomputed each run (small data volume).
    columns:
      - name: published_date
        description: Calendar date derived from published_at (toDate) - the grouping grain for this table.
      - name: source_name
        description: Human-readable outlet name as reported by the provider - the other grouping key for this table.
      - name: article_count
        description: Count of mart_articles rows for this (published_date, source_name) pair. Rows with a null published_at are excluded entirely.
