name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff black
      - name: ruff check
        run: ruff check airflow/dags fastapi_app scripts
      - name: black --check
        run: black --check airflow/dags fastapi_app scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc -b
      - name: Build
        run: npm run build

  dbt-build:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: clickhouse
          CLICKHOUSE_DB: default
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same version pins the real airflow image installs into its dedicated dbt venv
      # (see airflow/Dockerfile) - keeps CI honest about what actually runs in prod.
      - name: Install dbt
        run: pip install -r airflow/dbt-requirements.txt
      - name: Initialize ClickHouse schema (fresh-install DDL, not the migration scripts)
        run: python scripts/ci_init_clickhouse.py
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: clickhouse
      # profiles.yml is gitignored (it's a real per-deployment file, see dbt/profiles.yml.example) -
      # a fresh checkout only has the .example, which needs the same env-var-driven copy every
      # other environment (Airflow's dbt_venv, a contributor's laptop) already relies on.
      - name: Copy the profiles.yml example into place
        run: cp profiles.yml.example profiles.yml
        working-directory: dbt
      - name: dbt build
        working-directory: dbt
        run: >
          dbt build --profiles-dir . --project-dir . --profile news_intelligence --target prod
          --log-path /tmp/dbt_logs --target-path /tmp/dbt_target
        env:
          AIRFLOW_VAR_CLICKHOUSE_HOST: localhost
          AIRFLOW_VAR_CLICKHOUSE_PORT: "8123"
          AIRFLOW_VAR_CLICKHOUSE_USER: default
          AIRFLOW_VAR_CLICKHOUSE_PASSWORD: clickhouse
          AIRFLOW_VAR_CLICKHOUSE_DATABASE: default

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate a throwaway .env
        run: python3 scripts/generate_ci_env.py
      - name: Validate compose file
        run: docker compose config -q
      - name: Bring the stack up
        run: docker compose up -d
      # `docker compose up --wait` isn't used here: it treats *any* Exited container as a
      # failure, including minio-createbuckets, which is a legitimate one-shot job (restart:
      # "no", exits 0 once the bucket exists) that nothing else declares a
      # service_completed_successfully dependency on. Polling the documented health endpoints
      # directly sidesteps that --wait semantics gotcha entirely.
      - name: Wait for every documented health endpoint
        run: |
          wait_for() {
            local name=$1 url=$2
            for i in $(seq 1 60); do
              if curl -sf "$url" >/dev/null 2>&1; then
                echo "$name is up"
                return 0
              fi
              sleep 5
            done
            echo "$name never became reachable at $url" >&2
            return 1
          }
          wait_for airflow http://localhost:8080/api/v2/monitor/health
          wait_for clickhouse http://localhost:8123/ping
          wait_for fastapi http://localhost:8000/health
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
